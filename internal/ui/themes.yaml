# ── Popular terminal colour schemes ─────────────────────────────────────────
# The themes below are well-known editor/terminal palettes, mapped onto the
# roles above from the theme files of superfile (github.com/yorukot/superfile,
# MIT licence), whose look inspired the panel frames. Each keeps its scheme's
# own background as `canvas`, which is only painted when ui.paintBackground is
# on; with it off the terminal's background shows through as usual. Roles the
# source files don't define are derived: highlight is the active border mixed
# 16–35% into the canvas with whichever palette text colour reads best on it
# (≥4.5:1), muted is the text mixed 60% into the canvas, and the
# zebra stripe is the border mixed a quarter into the canvas.

# Catppuccin Mocha (catppuccin.com); via superfile's catppuccin-mocha.toml
- name: catppuccin-mocha
